spring:
  application:
    name: online-banking-system

  # ---- Default profile: MySQL ----
  # Switch to H2 for instant local testing with: --spring.profiles.active=h2
  datasource:
    url: jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Wwekane1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables from entities; use 'validate' in real prod
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false  # avoids the "open session in view" anti-pattern

server:
  port: 8080

jwt:
  # Base64-encoded HMAC-SHA256 secret. Generate your own for real deployments, e.g.:
  #   openssl rand -base64 32
  secret: TXlTdXBlclNlY3VyZUJhbmtpbmdBcHBKV1RTZWNyZXRLZXlGb3JIUzI1NkFsZ29yaXRobTIwMjQ=
  expiration-ms: 86400000   # 24 hours

logging:
  level:
    com.bankapp.banking: INFO
    org.springframework.security: WARN

---
# ---- "h2" profile: zero-setup in-memory DB for quick local dev/testing ----
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:banking_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
